<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiranex Blog Engine - Authenticate</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2>Secure Sign In</h2>
            <p>Access your Content Management Dashboard</p>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required placeholder="name@domain.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary">Authenticate Identity</button>
            </form>
            <p class="auth-redirect">New author? <a href="register.html">Create an Account</a></p>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
